<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#aee3ff">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Woofdoku — a cute puppy logic puzzle. Place one pup in every row, column and colored yard, and never let two pups touch. 120 levels, daily puzzles and 12 collectible pups.">
<title>Woofdoku</title>
<link rel="icon" href="assets/images/icon/paw.png">
<link rel="apple-touch-icon" href="assets/images/pup/corgi_joy.png">
<link rel="stylesheet" href="css/style.css?v=1.4.0">
</head>
<body>
<div id="backdrop"></div>
<div id="app">
  <!-- loading -->
  <div id="screen-loading" class="screen on">
    <div class="load-wrap">
      <img class="load-logo" src="assets/images/ui/logo.png" alt="Woofdoku">
      <div class="load-bar" id="load-bar"><i></i></div>
      <div class="load-pct st" id="load-pct">0%</div>
      <div class="load-msg st" id="load-msg"></div>
    </div>
  </div>

  <!-- home -->
  <div id="screen-home" class="screen">
    <div class="bg" id="h-bg"></div>
    <div class="topbar">
      <button class="coinbar coins" id="h-coins" aria-label="Coins"><img class="ci" alt=""><span class="val st">0</span><b class="plus"></b></button>
      <div class="spacer"></div>
      <button class="rbtn rnd orange" id="h-set" aria-label="Settings"><img alt=""></button>
    </div>
    <div class="home-logo"><img id="h-logo" alt="Woofdoku"><div class="ribbon pink mini"><span class="st" id="h-tag"></span></div></div>
    <div class="home-stage">
      <div class="home-side left">
        <button class="feat" id="f-gift"><span class="ic rnd pink"><img alt=""><b class="badge"></b></span><span class="lbl st"></span></button>
        <button class="feat" id="f-wheel"><span class="ic rnd purple"><img alt=""><b class="badge"></b></span><span class="lbl st"></span></button>
        <button class="feat" id="f-free"><span class="ic rnd blue"><img alt=""><b class="badge"></b></span><span class="lbl st"></span></button>
      </div>
      <div class="home-mascot">
        <div class="speech" id="h-speech"></div>
        <img id="h-mascot" alt="">
        <i class="shadow"></i>
      </div>
      <div class="home-side right">
        <button class="feat" id="f-daily"><span class="ic rnd gold"><img alt=""><b class="badge"></b></span><span class="lbl st"></span></button>
        <button class="feat" id="f-album"><span class="ic rnd orange"><img alt=""><b class="badge"></b></span><span class="lbl st"></span></button>
        <button class="feat" id="f-levels"><span class="ic rnd green"><img alt=""><b class="badge"></b></span><span class="lbl st"></span></button>
      </div>
    </div>
    <div class="home-bottom">
      <button class="boxbar" id="h-box"><img class="gi" alt=""><div class="bar"><i></i><span class="st"></span></div><b class="go st"></b></button>
      <button class="btn green big shine" id="h-play"><span class="t1 st"></span><span class="t2 st"></span></button>
    </div>
  </div>

  <!-- level map -->
  <div id="screen-map" class="screen">
    <div id="map-scroll"><div id="map-list"></div></div>
    <div class="topbar map-top">
      <button class="rbtn rnd orange" id="m-back" aria-label="Home"><img alt=""></button>
      <div class="map-title st" id="m-title"></div>
      <div class="spacer"></div>
      <div class="coinbar" id="m-stars"><img class="ci" alt=""><span class="val st">0</span></div>
      <button class="coinbar coins" id="m-coins"><img class="ci" alt=""><span class="val st">0</span><b class="plus"></b></button>
    </div>
  </div>

  <!-- puzzle -->
  <div id="screen-game" class="screen">
    <div class="bg" id="g-bg"></div>
    <div id="g-top">
      <div class="g-row">
        <button class="rbtn rnd orange" id="g-pause" aria-label="Pause"><img alt=""></button>
        <div class="g-titlebox">
          <div class="ribbon blue" id="g-ribbon"><span class="st" id="g-title"></span></div>
          <div class="g-sub"><span id="g-diff"></span><span id="g-difflbl"></span></div>
        </div>
        <div class="coinbar timebar"><img class="ci" alt="" id="g-clock"><span class="val st" id="g-time">00:00</span></div>
      </div>
      <div class="heartbar"><div id="g-pups"></div><div id="g-hearts"></div></div>
      <div id="g-rules">
        <div class="rulecard" data-r="color"><canvas></canvas><span></span></div>
        <div class="rulecard" data-r="line"><canvas></canvas><span></span></div>
        <div class="rulecard" data-r="touch"><canvas></canvas><span></span></div>
      </div>
    </div>
    <div id="g-mid">
      <div id="g-bubble"><span class="av"><img alt=""></span><div class="txt"></div></div>
      <div id="g-board"><canvas id="board"></canvas></div>
    </div>
    <div id="g-bottom">
      <div class="shelf">
        <button class="booster" id="b-hint"><span class="slot"><img class="bi" alt=""><img class="lock" alt=""></span><b class="cnt"></b><span class="lbl st"></span></button>
        <button class="booster" id="b-locate"><span class="slot"><img class="bi" alt=""><img class="lock" alt=""></span><b class="cnt"></b><span class="lbl st"></span></button>
      </div>
    </div>
    <img id="g-hand" alt="">
  </div>

  <canvas id="fx"></canvas>
  <div id="modal"></div>
  <div id="toast"></div>
  <div id="cover"></div>
</div>
<div id="rotate"><div><img src="assets/images/pup/corgi_sad.png" alt=""><p id="rotate-msg">Please rotate your phone to portrait</p></div></div>
<script src="js/i18n.js?v=1.4.0"></script>
<script src="js/store.js?v=1.4.0"></script>
<script src="js/puzzle.js?v=1.4.0"></script>
<script src="js/assets.js?v=1.4.0"></script>
<script src="js/audio.js?v=1.4.0"></script>
<script src="js/fx.js?v=1.4.0"></script>
<script src="js/board.js?v=1.4.0"></script>
<script src="js/ads.js?v=1.4.0"></script>
<script src="js/game.js?v=1.4.0"></script>
<script src="js/ui.js?v=1.4.0"></script>
<script src="js/main.js?v=1.4.0"></script>
</body>
</html>
